# Render Blueprint: New + > Blueprint, point at the repo.
# After the first deploy, set the "sync: false" values in the dashboard, then
# set CORS_ORIGINS on the API to the static site URL and VITE_API_BASE_URL on the site to the API URL.
databases:
  - name: blockradar-db
    plan: free
    databaseName: blockradar

services:
  - type: web
    name: blockradar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase: { name: blockradar-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATA_MODE
        value: real
      - key: BLOCKRADAR_API_KEY
        sync: false
      - key: BLOCKRADAR_WALLET_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: blockradar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
